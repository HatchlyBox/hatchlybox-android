# The project's Gradle settings. Nothing secret or machine-specific goes here: a machine's
# own settings go in ~/.gradle/gradle.properties or on the command line, and the release key's in signing.properties
# outside the repository (app/build.gradle.kts).
# Shared: the same on every machine.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
