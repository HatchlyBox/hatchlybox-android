# The app builds, on each pull request and each push (signed with the debug key: the release key never leaves the
# maintainers' machine).
name: Build
on:
  pull_request:
  push:
    branches: [main, nightly]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # GitHub's machines come with the Android SDK (ANDROID_HOME); Gradle adds the platform it needs.
      - name: Build
        run: ./gradlew --console=plain -q assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
